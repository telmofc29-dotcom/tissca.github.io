<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />
  <title>TISSCA — Invitation</title>

  <style>
    :root{
      /* ============================================================
         $200M STYLE — Variant A (Neutral Slate)
         LOCKED: use Android Dark neutrals exactly (Theme.kt)
         bg      #0B0D12
         card    #0F1219
         variant #1A2030
         outline #2A3142
         text    #E9ECF3
         muted   #B9C0D1
         ============================================================ */
      --bg:#0B0D12;
      --card:#0F1219;
      --variant:#1A2030;
      --outline:#2A3142;
      --text:#E9ECF3;
      --muted:rgba(185,192,209,.82);

      /* “Accent” stays neutral (derived from variant/outline only) */
      --accent1:#1A2030;
      --accent2:#2A3142;
      --accentText:#E9ECF3;

      --border:rgba(233,236,243,.10);
      --borderSoft:rgba(233,236,243,.08);
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* 1) Ambient breathing background (subtle, expensive) */
    .ambient{
      position:fixed;
      inset:-20%;
      z-index:-3;
      background:
        radial-gradient(900px 700px at 28% 22%, rgba(26,32,48,.55), transparent 62%),
        radial-gradient(900px 700px at 72% 68%, rgba(42,49,66,.38), transparent 62%),
        radial-gradient(1200px 900px at 55% 45%, rgba(233,236,243,.06), transparent 72%);
      filter: blur(18px);
      animation: ambientFloat 16s ease-in-out infinite;
      transform: translate3d(0,0,0);
      opacity:.9;
    }
    @keyframes ambientFloat{
      0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
      50%  { transform: translate3d( 2%,  1%, 0) scale(1.03); }
      100% { transform: translate3d(-2%, -1%, 0) scale(1); }
    }

    /* 3) Film-grain noise overlay (still pure CSS, less “patterny”) */
    .noise{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      opacity:.055;
      mix-blend-mode:overlay;
      background-image:
        repeating-linear-gradient(0deg,
          rgba(255,255,255,.035) 0px,
          rgba(255,255,255,.035) 1px,
          transparent 2px,
          transparent 4px),
        repeating-linear-gradient(90deg,
          rgba(0,0,0,.05) 0px,
          rgba(0,0,0,.05) 1px,
          transparent 2px,
          transparent 5px);
      animation: noiseShift 7s steps(6) infinite;
      transform: translate3d(0,0,0);
    }
    @keyframes noiseShift{
      0%   { transform: translate3d(0,0,0); }
      20%  { transform: translate3d(-2%,1%,0); }
      40%  { transform: translate3d(1%,-2%,0); }
      60%  { transform: translate3d(2%,2%,0); }
      80%  { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(0,0,0); }
    }

    .wrap{padding:24px}
    .card{
      max-width:680px;
      margin:12vh auto;
      background: rgba(15,18,25,.86);
      border-radius:28px;
      padding:40px;
      border:1px solid var(--borderSoft);
      box-shadow:
        0 28px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(233,236,243,.06);
      backdrop-filter: blur(12px);
    }

    h1{
      margin:0 0 12px 0;
      font-size:34px;
      letter-spacing:-0.65px;
      line-height:1.1;
    }

    p{
      margin:12px 0;
      line-height:1.7;
      color:var(--muted);
      font-size:15px;
    }

    .code{
      display:inline-block;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
      background: rgba(26,32,48,.55);
      border:1px solid rgba(233,236,243,.10);
      padding:9px 12px;
      border-radius:14px;
      margin-top:8px;
      font-size:13px;
      color:var(--text);
      max-width:100%;
      overflow:auto;
      white-space:nowrap;
    }

    .row{
      margin-top:26px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    /* $200M Buttons: restrained, carved, not loud */
    a.btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 22px;
      border-radius:999px;
      background: rgba(26,32,48,.88);
      color: var(--text);
      font-weight:850;
      text-decoration:none;
      letter-spacing:.2px;
      min-width:240px;
      transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease, border-color .22s ease;
      border: 1px solid rgba(233,236,243,.12);
      box-shadow:
        0 10px 26px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(233,236,243,.07);
      overflow:hidden;
      transform: translate3d(0,0,0);
    }

    /* Micro sheen (slow — “expensive”) */
    a.btn::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-60%;
      width:60%;
      height:180%;
      background: linear-gradient(120deg,
        transparent 0%,
        rgba(233,236,243,.14) 28%,
        rgba(233,236,243,.06) 42%,
        transparent 70%);
      transform: rotate(16deg);
      opacity:.35;
      animation: sheen 6.4s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    @keyframes sheen{
      0%   { left:-60%; opacity:.10; }
      30%  { opacity:.38; }
      55%  { opacity:.18; }
      100% { left:120%; opacity:.10; }
    }

    a.btn:hover{
      transform: translateY(-2px);
      border-color: rgba(233,236,243,.20);
      box-shadow:
        0 16px 46px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(233,236,243,.08);
    }
    a.btn:active{
      transform: translateY(0);
      box-shadow:
        0 10px 28px rgba(0,0,0,.42),
        inset 0 2px 6px rgba(0,0,0,.28);
    }

    a.primary{
      background: linear-gradient(160deg, rgba(26,32,48,.92), rgba(42,49,66,.84));
      border-color: rgba(233,236,243,.14);
    }

    a.secondary{
      background: rgba(15,18,25,.55);
      border-color: rgba(233,236,243,.10);
    }
    a.secondary::after{ opacity:.22; animation-duration: 7.2s; }

    .meta{
      margin-top:18px;
      font-size:12px;
      color:rgba(185,192,209,.72);
    }

    @media (max-width: 600px){
      .card{padding:28px}
      a.btn{min-width: 100%}
    }

    @media (prefers-reduced-motion: reduce){
      .ambient,.noise,a.btn::after{animation:none}
      a.btn{transition:none}
    }
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div class="wrap">
    <div class="card">
      <h1>You’re invited to TISSCA</h1>

      <p id="desc">
        We’re opening your invitation. If the app doesn’t launch automatically, you can install it below and try again.
      </p>

      <p>
        Invitation links look like:
        <span class="code" id="example">https://tissca.com/invite/&lt;inviteId&gt;</span>
      </p>

      <div class="row">
        <a class="btn primary" id="primaryCta" href="https://tissca.com" rel="noopener">
          Continue
        </a>

        <a class="btn secondary" id="secondaryCta" href="https://tissca.com" rel="noopener">
          Visit website
        </a>
      </div>

      <div class="meta" id="meta">
        TISSCA — Professional workspace management for modern teams.
      </div>
    </div>
  </div>

  <script>
    const PLAY_STORE_URL = "https://play.google.com/store";
    const APP_STORE_URL  = "https://apps.apple.com/";
    const WEB_URL        = "https://tissca.com";

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    const primary = document.getElementById("primaryCta");
    const secondary = document.getElementById("secondaryCta");
    const desc = document.getElementById("desc");

    const deepLink = "tissca://auth/callback";

    if (isAndroid) {
      primary.textContent = "Download for Android";
      primary.href = PLAY_STORE_URL;

      secondary.textContent = "Open the app";
      secondary.href = deepLink;

      desc.textContent = "If the app doesn’t launch automatically, install it below — then open the invitation link again.";
    } else if (isIOS) {
      primary.textContent = "Download for iPhone";
      primary.href = APP_STORE_URL;

      secondary.textContent = "Open the app";
      secondary.href = deepLink;

      desc.textContent = "If the app doesn’t launch automatically, install it below — then open the invitation link again.";
    } else {
      primary.textContent = "Continue on web";
      primary.href = WEB_URL;

      secondary.textContent = "Get the app";
      secondary.href = PLAY_STORE_URL;

      desc.textContent = "If you opened an invite link on a phone and the app didn’t launch automatically, install the app and try again.";
    }
  </script>
</body>
</html>
