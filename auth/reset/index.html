<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />
  <title>TISSCA — Reset Password</title>

  <style>
    :root{
      --bg:#1b1412;
      --card:#2a1f1b;
      --text:#f4eee9;
      --muted:rgba(244,238,233,.76);

      --field:#1f1714;
      --border:rgba(255,255,255,.16);
      --borderSoft:rgba(255,255,255,.10);

      --accent1:#ffb38f;
      --accent2:#ff9f73;
      --accentText:#2a1f1b;

      --danger:#ffb4b4;
      --ok:rgba(147,255,195,.9);
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* ============================================================
       LOCKED PREMIUM: Ambient breathing background + noise overlay
       ============================================================ */
    .ambient{
      position:fixed;
      inset:-20%;
      z-index:-3;
      background:
        radial-gradient(900px 700px at 30% 25%, rgba(255,179,143,.18), transparent 60%),
        radial-gradient(900px 700px at 70% 65%, rgba(255,159,115,.12), transparent 60%),
        radial-gradient(1200px 900px at 55% 45%, rgba(255,255,255,.05), transparent 70%);
      filter: blur(18px);
      animation: ambientFloat 14s ease-in-out infinite;
      transform: translate3d(0,0,0);
      opacity:.9;
    }
    @keyframes ambientFloat{
      0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
      50%  { transform: translate3d( 2%,  1%, 0) scale(1.03); }
      100% { transform: translate3d(-2%, -1%, 0) scale(1); }
    }

    .noise{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      opacity:.06;
      mix-blend-mode:overlay;
      background-image:
        repeating-radial-gradient(circle at 20% 20%,
          rgba(255,255,255,.08) 0 1px, transparent 1px 3px),
        repeating-radial-gradient(circle at 80% 70%,
          rgba(0,0,0,.10) 0 1px, transparent 1px 4px);
      animation: noiseShift 7s steps(6) infinite;
      transform: translate3d(0,0,0);
    }
    @keyframes noiseShift{
      0%   { transform: translate3d(0,0,0); }
      20%  { transform: translate3d(-2%,1%,0); }
      40%  { transform: translate3d(1%,-2%,0); }
      60%  { transform: translate3d(2%,2%,0); }
      80%  { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(0,0,0); }
    }

    .wrap{padding:24px}

    .card{
      max-width:640px;
      margin:10vh auto;
      background:rgba(42,31,27,.86);
      border-radius:26px;
      padding:38px;
      border:1px solid var(--borderSoft);
      box-shadow:0 26px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }

    h1{
      margin:0 0 12px 0;
      font-size:32px;
      letter-spacing:-0.55px;
    }

    p{
      margin:12px 0;
      line-height:1.65;
      color:var(--muted);
      font-size:15px;
    }

    label{
      display:block;
      margin-top:14px;
      font-size:13px;
      color:rgba(244,238,233,.78);
    }

    input{
      width:100%;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(31,23,20,.82);
      color:var(--text);
      margin-top:8px;
      outline:none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    }
    input:focus{
      border-color:rgba(255,179,143,.55);
      box-shadow:0 0 0 4px rgba(255,179,143,.12);
      transform: translateY(-1px);
    }

    .row{
      display:flex;
      gap:12px;
      margin-top:18px;
      flex-wrap:wrap;
      align-items:center;
    }

    /* ============================================================
       LOCKED PREMIUM BUTTONS: glow + shimmer + hover physics
       ============================================================ */
    button,a.btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 22px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      text-decoration:none;
      font-weight:850;
      letter-spacing:.25px;
      transition: all .25s cubic-bezier(.22,1,.36,1);
      overflow:hidden;
      transform: translate3d(0,0,0);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .primary{
      background: linear-gradient(145deg, var(--accent1), var(--accent2));
      color: var(--accentText);
      min-width: 230px;
      box-shadow:
        0 8px 22px rgba(255,179,143,.22),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    /* glow */
    .primary::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:999px;
      background: radial-gradient(circle at 50% 50%, rgba(255,179,143,.45), transparent 70%);
      opacity:0;
      transition: opacity .35s ease;
      pointer-events:none;
    }

    /* shimmer */
    .primary::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-60%;
      width:60%;
      height:180%;
      background: linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,.28) 30%,
        rgba(255,255,255,.10) 45%,
        transparent 70%);
      transform: rotate(16deg);
      opacity:.55;
      animation: shimmer 3.8s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    @keyframes shimmer{
      0%   { left:-60%; opacity:.10; }
      35%  { opacity:.55; }
      60%  { opacity:.25; }
      100% { left:120%; opacity:.10; }
    }

    button.secondary,a.secondary{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      color: var(--text);
      box-shadow: none;
    }
    button.secondary::after,a.secondary::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-60%;
      width:60%;
      height:180%;
      background: linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,.14) 30%,
        rgba(255,255,255,.06) 45%,
        transparent 70%);
      transform: rotate(16deg);
      opacity:.25;
      animation: shimmer 5.2s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }

    button:hover,a.btn:hover{
      transform: translateY(-4px);
    }
    .primary:hover{
      box-shadow:
        0 14px 46px rgba(255,179,143,.42),
        inset 0 1px 0 rgba(255,255,255,.38);
    }
    .primary:hover::before{opacity:1}
    button.secondary:hover,a.secondary:hover{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 14px 42px rgba(0,0,0,.42);
    }

    button:active,a.btn:active{
      transform: translateY(0);
    }
    .primary:active{
      box-shadow:
        0 6px 16px rgba(255,179,143,.22),
        inset 0 2px 6px rgba(0,0,0,.22);
    }

    button:disabled{
      opacity:.65;
      cursor:not-allowed;
      transform:none;
    }

    .hint{
      font-size:13px;
      margin-top:12px;
      color:rgba(244,238,233,.68);
      line-height:1.55;
    }

    .err{
      margin-top:14px;
      color:var(--danger);
      font-size:13px;
      line-height:1.45;
    }

    .debug{
      display:none;
      margin-top:12px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      word-break:break-all;
    }

    .footer{
      margin-top:22px;
      font-size:12px;
      color:rgba(255,255,255,.52);
    }

    @media (max-width: 640px){
      .card{padding:28px;border-radius:22px}
      .primary{min-width:100%}
      button.secondary,a.secondary{width:100%}
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .ambient,.noise,.primary::after,button.secondary::after,a.secondary::after{animation:none}
      button,a.btn{transition:none}
    }
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div class="wrap">
    <div class="card">
      <h1 id="title">Preparing reset…</h1>
      <p id="msg">Please wait while we open your reset link.</p>

      <div id="form" style="display:none;">
        <label for="pw1">New password</label>
        <input id="pw1" type="password" placeholder="Enter a new password" autocomplete="new-password" />

        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" placeholder="Confirm the new password" autocomplete="new-password" />

        <div class="row">
          <button id="btn" class="primary" type="button">Update password</button>
          <a id="openApp" class="btn secondary" href="tissca://auth/callback" style="display:none;">Open the app</a>
        </div>

        <div class="hint">Tip: Use a strong password (8+ characters). After updating, you can return to the app and sign in.</div>
      </div>

      <div id="err" class="err" style="display:none;"></div>
      <div id="debug" class="debug"></div>

      <div class="footer">TISSCA — secure account recovery</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ===============================================================
    // ✅ CONFIG (ONE PLACE ONLY — NO DUPLICATES)
    // Supabase Dashboard → Project Settings → API
    // Copy: "anon public" key
    // ===============================================================
    const SUPABASE_URL = "https://ovkpblbnnvnmsulrrnor.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hHm8j6LDzX02VYbayMaZZw_8n_E901Y";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const btn = document.getElementById("btn");
    const openApp = document.getElementById("openApp");
    const errBox = document.getElementById("err");
    const debug = document.getElementById("debug");

    function setError(text, showDebug = false) {
      errBox.style.display = "block";
      errBox.textContent = text;
      if (showDebug) {
        debug.style.display = "block";
        debug.textContent = window.location.href;
      }
    }

    function showForm() {
      form.style.display = "block";
    }

    function showSuccess() {
      title.textContent = "Password updated";
      msg.textContent = "All done — you can now go back to the app and sign in.";
      form.style.display = "none";

      openApp.style.display = "inline-flex";
      openApp.classList.remove("secondary");
      openApp.classList.add("primary");
    }

    // Parse params from BOTH query string and hash fragment.
    // Supabase links may arrive as:
    // - ?code=...
    // - ?token_hash=...&type=recovery
    // - #access_token=...&refresh_token=...&type=recovery
    function parseParams() {
      const url = new URL(window.location.href);
      const q = url.searchParams;

      const hash = (window.location.hash || "").replace(/^#/, "");
      const h = new URLSearchParams(hash);

      return {
        code: q.get("code") || null,
        token_hash: q.get("token_hash") || null,
        type: q.get("type") || null,
        access_token: h.get("access_token") || null,
        refresh_token: h.get("refresh_token") || null,
        hash_type: h.get("type") || null,
      };
    }

    async function establishSessionFromLink(p) {
      if (p.code) {
        const { error } = await supabase.auth.exchangeCodeForSession(p.code);
        if (error) throw error;
        return;
      }

      if (p.token_hash) {
        const t = p.type || "recovery";
        const { error } = await supabase.auth.verifyOtp({ token_hash: p.token_hash, type: t });
        if (error) throw error;
        return;
      }

      if (p.access_token && p.refresh_token) {
        const { error } = await supabase.auth.setSession({
          access_token: p.access_token,
          refresh_token: p.refresh_token,
        });
        if (error) throw error;
        return;
      }

      throw new Error("Missing reset parameters in the link.");
    }

    (async () => {
      try {
        if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "__SUPABASE_ANON_KEY__") {
          title.textContent = "Setup needed";
          msg.textContent = "This page is missing the Supabase anon key.";
          setError("Add your Supabase anon public key in this file (Project Settings → API).", true);
          return;
        }

        const p = parseParams();
        await establishSessionFromLink(p);

        title.textContent = "Reset your password";
        msg.textContent = "Enter a new password below.";
        showForm();

        openApp.style.display = "inline-flex";

        btn.addEventListener("click", async () => {
          errBox.style.display = "none";
          btn.disabled = true;
          btn.textContent = "Updating…";

          try {
            const a = (pw1.value || "").trim();
            const b = (pw2.value || "").trim();

            if (!a || a.length < 8) {
              setError("Password must be at least 8 characters.");
              return;
            }
            if (a !== b) {
              setError("Passwords do not match.");
              return;
            }

            const { error } = await supabase.auth.updateUser({ password: a });
            if (error) throw error;

            showSuccess();
          } catch (e) {
            setError(e?.message || "Could not update password. Please try again.", false);
          } finally {
            btn.disabled = false;
            btn.textContent = "Update password";
          }
        });

      } catch (e) {
        title.textContent = "Reset link issue";
        msg.textContent = "We couldn’t open your reset link.";
        setError(e?.message || "Unknown error.", true);
      }
    })();
  </script>
</body>
</html>
