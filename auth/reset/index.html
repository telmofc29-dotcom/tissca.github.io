<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />
  <title>TISSCA — Reset Password</title>
  <style>
    :root{
      --bg:#1b1412; --card:#2a1f1b; --muted:rgba(244,238,233,.78); --text:#f4eee9;
      --field:#1f1714; --border:rgba(255,255,255,.16); --btn:#ffb38f; --btnText:#2a1f1b;
      --danger:#ffb4b4;
    }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:var(--text);}
    .wrap{padding:22px;}
    .card{max-width:560px;margin:10vh auto;background:var(--card);border-radius:18px;padding:26px;border:1px solid rgba(255,255,255,.08);}
    h1{margin:0 0 10px;font-size:28px;letter-spacing:-0.2px;}
    p{margin:10px 0;opacity:.92;line-height:1.55;color:var(--muted);}
    label{display:block;margin-top:12px;font-size:13px;color:var(--muted);}
    input{
      width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
      background:var(--field);color:var(--text);margin-top:8px;outline:none;
    }
    input:focus{border-color:rgba(255,179,143,.55);box-shadow:0 0 0 4px rgba(255,179,143,.12);}
    .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
    button,a.btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      padding:12px 16px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
      font-weight:750;letter-spacing:.2px;
    }
    button.primary,a.primary{background:var(--btn);color:var(--btnText);min-width:220px;}
    button.secondary,a.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12);}
    button:disabled{opacity:.65;cursor:not-allowed;}
    .hint{font-size:13px;margin-top:10px;color:var(--muted);}
    .err{margin-top:12px;color:var(--danger);font-size:13px;line-height:1.45;}
    .debug{display:none;margin-top:12px;font-size:12px;color:rgba(255,255,255,.55);word-break:break-all;}
    .footer{margin-top:14px;font-size:12px;color:rgba(255,255,255,.55);}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Preparing reset…</h1>
      <p id="msg">Please wait while we open your reset link.</p>

      <div id="form" style="display:none;">
        <label for="pw1">New password</label>
        <input id="pw1" type="password" placeholder="Enter a new password" autocomplete="new-password" />

        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" placeholder="Confirm the new password" autocomplete="new-password" />

        <div class="row">
          <button id="btn" class="primary" type="button">Update password</button>
          <a id="openApp" class="btn secondary" href="tissca://auth/callback" style="display:none;">Open the app</a>
        </div>

        <div class="hint">Tip: Use a strong password (8+ characters). After updating, you can return to the app and sign in.</div>
      </div>

      <div id="err" class="err" style="display:none;"></div>
      <div id="debug" class="debug"></div>

      <div class="footer">TISSCA — secure account recovery</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ===============================================================
    // ✅ CONFIG (ONE PLACE ONLY — NO DUPLICATES)
    // Supabase Dashboard → Project Settings → API
    // Copy: "anon public" key
    // ===============================================================
    const SUPABASE_URL = "https://ovkpblbnnvnmsulrrnor.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hHm8j6LDzX02VYbayMaZZw_8n_E901Y"; // <-- paste your anon key here

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const btn = document.getElementById("btn");
    const openApp = document.getElementById("openApp");
    const errBox = document.getElementById("err");
    const debug = document.getElementById("debug");

    function setError(text, showDebug = false) {
      errBox.style.display = "block";
      errBox.textContent = text;
      if (showDebug) {
        debug.style.display = "block";
        debug.textContent = window.location.href;
      }
    }

    function showForm() {
      form.style.display = "block";
    }

    function showSuccess() {
      title.textContent = "Password updated";
      msg.textContent = "All done — you can now go back to the app and sign in.";
      form.style.display = "none";

      openApp.style.display = "inline-flex";
      openApp.classList.add("primary");
      openApp.classList.remove("secondary");
    }

    // Parse params from BOTH query string and hash fragment.
    // Supabase links may arrive as:
    // - ?code=...
    // - ?token_hash=...&type=recovery
    // - #access_token=...&refresh_token=...&type=recovery
    function parseParams() {
      const url = new URL(window.location.href);
      const q = url.searchParams;

      const hash = (window.location.hash || "").replace(/^#/, "");
      const h = new URLSearchParams(hash);

      return {
        // Query-string style
        code: q.get("code") || null,
        token_hash: q.get("token_hash") || null,
        type: q.get("type") || null,

        // Hash/implicit style
        access_token: h.get("access_token") || null,
        refresh_token: h.get("refresh_token") || null,
        hash_type: h.get("type") || null,
      };
    }

    async function establishSessionFromLink(p) {
      // 1) Newer flow: ?code=
      if (p.code) {
        const { error } = await supabase.auth.exchangeCodeForSession(p.code);
        if (error) throw error;
        return;
      }

      // 2) token_hash + type
      // If token_hash is present but type is missing, assume recovery on this page.
      if (p.token_hash) {
        const t = p.type || "recovery";
        const { error } = await supabase.auth.verifyOtp({ token_hash: p.token_hash, type: t });
        if (error) throw error;
        return;
      }

      // 3) Hash fragment tokens (implicit)
      if (p.access_token && p.refresh_token) {
        const { error } = await supabase.auth.setSession({
          access_token: p.access_token,
          refresh_token: p.refresh_token,
        });
        if (error) throw error;
        return;
      }

      throw new Error("Missing reset parameters in the link.");
    }

    (async () => {
      try {
        if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "__SUPABASE_ANON_KEY__") {
          title.textContent = "Setup needed";
          msg.textContent = "This page is missing the Supabase anon key.";
          setError("Add your Supabase anon public key in this file (Project Settings → API).", true);
          return;
        }

        const p = parseParams();
        await establishSessionFromLink(p);

        // If we got here, we have a recovery session.
        title.textContent = "Reset your password";
        msg.textContent = "Enter a new password below.";
        showForm();

        // Show "Open app" once link is valid (Android/iOS)
        openApp.style.display = "inline-flex";

        btn.addEventListener("click", async () => {
          errBox.style.display = "none";
          btn.disabled = true;
          btn.textContent = "Updating…";

          try {
            const a = (pw1.value || "").trim();
            const b = (pw2.value || "").trim();

            if (!a || a.length < 8) {
              setError("Password must be at least 8 characters.");
              return;
            }
            if (a !== b) {
              setError("Passwords do not match.");
              return;
            }

            const { error } = await supabase.auth.updateUser({ password: a });
            if (error) throw error;

            showSuccess();
          } catch (e) {
            setError(e?.message || "Could not update password. Please try again.", false);
          } finally {
            btn.disabled = false;
            btn.textContent = "Update password";
          }
        });

      } catch (e) {
        title.textContent = "Reset link issue";
        msg.textContent = "We couldn’t open your reset link.";
        setError(e?.message || "Unknown error.", true);
      }
    })();
  </script>
</body>
</html>
