<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />
  <title>TISSCA — Verified</title>

  <style>
    :root{
      --blue:#2d4152;
      --gold1:#CBB26B;
      --bg:#0b141b;
      --bg2:#0e1a23;
      --card:rgba(16,28,38,.78);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.70);
      --border:rgba(255,255,255,.12);
      --danger:#ffb4b4;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 900px at 50% 20%, rgba(45,65,82,.22), transparent 60%),
                  radial-gradient(900px 700px at 20% 80%, rgba(203,178,107,.10), transparent 62%),
                  linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    .ambient{
      position:fixed; inset:-20%; z-index:-3;
      background:
        radial-gradient(950px 720px at 30% 22%, rgba(45,65,82,.34), transparent 62%),
        radial-gradient(900px 700px at 75% 70%, rgba(203,178,107,.14), transparent 62%),
        radial-gradient(1200px 900px at 55% 48%, rgba(255,255,255,.05), transparent 70%);
      filter: blur(18px);
      animation: ambientFloat 16s ease-in-out infinite;
      opacity:.9;
    }
    @keyframes ambientFloat{
      0%{transform:translate3d(-2%,-1%,0) scale(1)}
      50%{transform:translate3d(2%,1%,0) scale(1.03)}
      100%{transform:translate3d(-2%,-1%,0) scale(1)}
    }

    .noise{
      position:fixed; inset:0; z-index:-2; pointer-events:none;
      opacity:.055; mix-blend-mode:overlay;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 2px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 1px, transparent 2px, transparent 5px);
      animation: noiseShift 7s steps(6) infinite;
    }
    @keyframes noiseShift{
      0%{transform:translate3d(0,0,0)}
      20%{transform:translate3d(-2%,1%,0)}
      40%{transform:translate3d(1%,-2%,0)}
      60%{transform:translate3d(2%,2%,0)}
      80%{transform:translate3d(-1%,-1%,0)}
      100%{transform:translate3d(0,0,0)}
    }

    .wrap{padding:22px}
    .card{
      max-width:560px;
      margin:10vh auto;
      background: linear-gradient(180deg, var(--card), rgba(16,28,38,.62));
      border-radius:22px;
      padding:28px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:
        0 28px 90px rgba(0,0,0,.58),
        0 0 0 1px rgba(45,65,82,.14),
        inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(12px);
    }

    h1{margin:0 0 10px;font-size:28px;letter-spacing:-0.2px;}
    p{margin:10px 0;line-height:1.55;color:var(--muted);}

    .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

    a.btn{
      position:relative;
      display:inline-flex;align-items:center;justify-content:center;
      padding:12px 16px;border-radius:999px;
      text-decoration:none;font-weight:800;letter-spacing:.2px;
      min-width:220px;
      border:1px solid rgba(255,255,255,.12);
      overflow:hidden;
      transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease, border-color .22s ease;
    }

    a.primary{
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(900px 200px at 20% 0%, rgba(203,178,107,.18), transparent 55%),
        linear-gradient(145deg, rgba(45,65,82,.92), rgba(20,36,48,.86));
      box-shadow:
        0 14px 44px rgba(0,0,0,.46),
        0 0 0 1px rgba(45,65,82,.18),
        0 0 28px rgba(45,65,82,.16),
        inset 0 1px 0 rgba(255,255,255,.10);
    }

    a.secondary{
      color: rgba(255,255,255,.90);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: 0 12px 36px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.06);
    }

    a.btn::after{
      content:"";
      position:absolute;top:-40%;left:-60%;
      width:60%;height:180%;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.16) 26%, rgba(203,178,107,.14) 36%, rgba(255,255,255,.06) 46%, transparent 70%);
      transform: rotate(16deg);
      opacity:.28;
      animation: sheen 6.6s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    @keyframes sheen{
      0%{left:-60%;opacity:.10}
      30%{opacity:.28}
      55%{opacity:.14}
      100%{left:120%;opacity:.10}
    }

    a.btn:hover{
      transform: translateY(-2px);
      border-color: rgba(203,178,107,.22);
      box-shadow: 0 18px 58px rgba(0,0,0,.55), 0 0 0 1px rgba(203,178,107,.12), inset 0 1px 0 rgba(255,255,255,.10);
    }
    a.btn:active{transform: translateY(0);}

    .err{margin-top:12px;color:var(--danger);font-size:13px;line-height:1.45;display:none;}
    .debug{display:none;margin-top:12px;font-size:12px;color:rgba(255,255,255,.50);word-break:break-all;}
    .footer{margin-top:14px;font-size:12px;color:rgba(255,255,255,.50);}
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div class="wrap">
    <div class="card">
      <h1 id="title">Working…</h1>
      <p id="msg">Please wait while we confirm your request.</p>

      <div class="row" id="actions" style="display:none;">
        <a class="btn primary" href="tissca://auth/callback">Open the app</a>
        <a class="btn secondary" href="https://tissca.com">Continue on web</a>
      </div>

      <div id="err" class="err"></div>
      <div id="debug" class="debug"></div>

      <div class="footer">TISSCA — secure verification</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://ovkpblbnnvnmsulrrnor.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hHm8j6LDzX02VYbayMaZZw_8n_E901Y";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const actions = document.getElementById("actions");
    const errBox = document.getElementById("err");
    const debug = document.getElementById("debug");

    function setError(text, showDebug = false) {
      title.textContent = "Something went wrong";
      msg.textContent = "We couldn’t complete this request.";
      errBox.style.display = "block";
      errBox.textContent = text;
      if (showDebug) {
        debug.style.display = "block";
        debug.textContent = window.location.href;
      }
    }

    function normaliseType(input) {
      const t = (input || "signup").toLowerCase().trim();

      // Map your template-friendly names → Supabase expected types
      if (t === "reset") return "recovery";
      if (t === "recovery") return "recovery";

      if (t === "magic") return "magiclink";
      if (t === "magiclink") return "magiclink";

      if (t === "change_email") return "email_change";
      if (t === "email_change") return "email_change";
      if (t === "email_change" || t === "emailchange") return "email_change";

      if (t === "invite") return "invite";
      if (t === "signup") return "signup";

      // Default safe
      return "signup";
    }

    function setSuccess(type) {
      const t = normaliseType(type);

      if (t === "email_change") {
        title.textContent = "Email confirmed";
        msg.textContent = "Your email address has been updated. You can now return to the app and sign in using your new email.";
      } else if (t === "magiclink") {
        title.textContent = "Signed in";
        msg.textContent = "You’re signed in securely. You can now return to the app.";
      } else if (t === "invite") {
        title.textContent = "Invitation accepted";
        msg.textContent = "Thanks — your invitation has been accepted. You can now open the app.";
      } else {
        title.textContent = "Email verified";
        msg.textContent = "Thank you — your email has been verified. You can now return to the app and sign in.";
      }

      actions.style.display = "flex";
    }

    function parseParams() {
      const url = new URL(window.location.href);
      const q = url.searchParams;

      const hash = (window.location.hash || "").replace(/^#/, "");
      const h = new URLSearchParams(hash);

      const tokenFromQuery = q.get("token") || null;
      const tokenHashFromQuery = q.get("token_hash") || null;

      return {
        code: q.get("code") || null,
        type: q.get("type") || null,
        token_hash: tokenHashFromQuery || tokenFromQuery || null,

        // Hash params (some flows)
        access_token: h.get("access_token") || null,
        refresh_token: h.get("refresh_token") || null
      };
    }

    async function establishSessionFromLink(p) {
      if (p.code) {
        const { error } = await supabase.auth.exchangeCodeForSession(p.code);
        if (error) throw error;
        return;
      }

      if (p.token_hash) {
        const { error } = await supabase.auth.verifyOtp({
          token_hash: p.token_hash,
          type: normaliseType(p.type)
        });
        if (error) throw error;
        return;
      }

      if (p.access_token && p.refresh_token) {
        const { error } = await supabase.auth.setSession({
          access_token: p.access_token,
          refresh_token: p.refresh_token
        });
        if (error) throw error;
        return;
      }

      throw new Error("Missing verification parameters in the link.");
    }

    (async () => {
      try {
        const p = parseParams();
        await establishSessionFromLink(p);
        setSuccess(p.type);
      } catch (e) {
        setError(e?.message || "Unknown error.", true);
      }
    })();
  </script>
</body>
</html>
