<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />
  <title>TISSCA — Email Verified</title>

  <style>
    :root{
      --bg:#1b1412;
      --card:#2a1f1b;
      --text:#f4eee9;
      --muted:rgba(244,238,233,.76);

      --border:rgba(255,255,255,.16);
      --borderSoft:rgba(255,255,255,.10);

      --accent1:#ffb38f;
      --accent2:#ff9f73;
      --accentText:#2a1f1b;

      --danger:#ffb4b4;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* ============================================================
       LOCKED PREMIUM: Ambient breathing background + noise overlay
       ============================================================ */
    .ambient{
      position:fixed;
      inset:-20%;
      z-index:-3;
      background:
        radial-gradient(900px 700px at 30% 25%, rgba(255,179,143,.18), transparent 60%),
        radial-gradient(900px 700px at 70% 65%, rgba(255,159,115,.12), transparent 60%),
        radial-gradient(1200px 900px at 55% 45%, rgba(255,255,255,.05), transparent 70%);
      filter: blur(18px);
      animation: ambientFloat 14s ease-in-out infinite;
      transform: translate3d(0,0,0);
      opacity:.9;
    }
    @keyframes ambientFloat{
      0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
      50%  { transform: translate3d( 2%,  1%, 0) scale(1.03); }
      100% { transform: translate3d(-2%, -1%, 0) scale(1); }
    }

    .noise{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      opacity:.06;
      mix-blend-mode:overlay;
      background-image:
        repeating-radial-gradient(circle at 20% 20%,
          rgba(255,255,255,.08) 0 1px, transparent 1px 3px),
        repeating-radial-gradient(circle at 80% 70%,
          rgba(0,0,0,.10) 0 1px, transparent 1px 4px);
      animation: noiseShift 7s steps(6) infinite;
      transform: translate3d(0,0,0);
    }
    @keyframes noiseShift{
      0%   { transform: translate3d(0,0,0); }
      20%  { transform: translate3d(-2%,1%,0); }
      40%  { transform: translate3d(1%,-2%,0); }
      60%  { transform: translate3d(2%,2%,0); }
      80%  { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(0,0,0); }
    }

    .wrap{padding:24px}
    .card{
      max-width:640px;
      margin:10vh auto;
      background:rgba(42,31,27,.86);
      border-radius:26px;
      padding:38px;
      border:1px solid var(--borderSoft);
      box-shadow:0 26px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }

    h1{
      margin:0 0 12px 0;
      font-size:32px;
      letter-spacing:-0.55px;
    }

    p{
      margin:12px 0;
      line-height:1.65;
      color:var(--muted);
      font-size:15px;
    }

    .row{
      margin-top:22px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    /* ============================================================
       LOCKED PREMIUM BUTTONS: glow + shimmer + hover physics
       ============================================================ */
    a.btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 22px;
      border-radius:999px;
      text-decoration:none;
      font-weight:850;
      letter-spacing:.25px;
      min-width:230px;
      transition: all .25s cubic-bezier(.22,1,.36,1);
      overflow:hidden;
      transform: translate3d(0,0,0);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    a.primary{
      background: linear-gradient(145deg, var(--accent1), var(--accent2));
      color: var(--accentText);
      box-shadow:
        0 8px 22px rgba(255,179,143,.22),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    /* glow */
    a.primary::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:999px;
      background: radial-gradient(circle at 50% 50%, rgba(255,179,143,.45), transparent 70%);
      opacity:0;
      transition: opacity .35s ease;
      pointer-events:none;
    }

    /* shimmer */
    a.primary::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-60%;
      width:60%;
      height:180%;
      background: linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,.28) 30%,
        rgba(255,255,255,.10) 45%,
        transparent 70%);
      transform: rotate(16deg);
      opacity:.55;
      animation: shimmer 3.8s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }

    @keyframes shimmer{
      0%   { left:-60%; opacity:.10; }
      35%  { opacity:.55; }
      60%  { opacity:.25; }
      100% { left:120%; opacity:.10; }
    }

    a.secondary{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      color: var(--text);
      box-shadow: none;
    }

    a.secondary::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-60%;
      width:60%;
      height:180%;
      background: linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,.14) 30%,
        rgba(255,255,255,.06) 45%,
        transparent 70%);
      transform: rotate(16deg);
      opacity:.25;
      animation: shimmer 5.2s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }

    a.btn:hover{ transform: translateY(-4px); }
    a.primary:hover{
      box-shadow:
        0 14px 46px rgba(255,179,143,.42),
        inset 0 1px 0 rgba(255,255,255,.38);
    }
    a.primary:hover::before{opacity:1}
    a.secondary:hover{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 14px 42px rgba(0,0,0,.42);
    }
    a.btn:active{ transform: translateY(0); }

    .err{
      margin-top:14px;
      color:var(--danger);
      font-size:13px;
      line-height:1.45;
      display:none;
    }

    .debug{
      display:none;
      margin-top:12px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      word-break:break-all;
    }

    .footer{
      margin-top:22px;
      font-size:12px;
      color:rgba(255,255,255,.52);
    }

    @media (max-width: 640px){
      .card{padding:28px;border-radius:22px}
      a.btn{min-width:100%}
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .ambient,.noise,a.primary::after,a.secondary::after{animation:none}
      a.btn{transition:none}
    }
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div class="wrap">
    <div class="card">
      <h1 id="title">Verifying…</h1>
      <p id="msg">Please wait while we confirm your email.</p>

      <div class="row" id="actions" style="display:none;">
        <a id="openApp" class="btn primary" href="tissca://auth/callback">Open the app</a>
        <a id="goWeb" class="btn secondary" href="https://tissca.com">Continue on web</a>
      </div>

      <div id="err" class="err"></div>
      <div id="debug" class="debug"></div>

      <div class="footer">TISSCA — secure account verification</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ===============================================================
    // ✅ CONFIG (ONE PLACE ONLY — NO DUPLICATES)
    // Supabase Dashboard → Project Settings → API
    // Copy: "anon public" key
    // ===============================================================
    const SUPABASE_URL = "https://ovkpblbnnvnmsulrrnor.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hHm8j6LDzX02VYbayMaZZw_8n_E901Y";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const actions = document.getElementById("actions");
    const errBox = document.getElementById("err");
    const debug = document.getElementById("debug");

    function setError(text, showDebug = false) {
      title.textContent = "Verification failed";
      msg.textContent = "We couldn’t confirm your email.";
      errBox.style.display = "block";
      errBox.textContent = text;

      if (showDebug) {
        debug.style.display = "block";
        debug.textContent = window.location.href;
      }
    }

    function setSuccess() {
      title.textContent = "Email verified";
      msg.textContent = "Thank you — your email has been verified. You can now return to the app and sign in.";
      actions.style.display = "flex";
    }

    // Supabase links may arrive as:
    // - ?code=...
    // - ?token_hash=...&type=signup
    // - #access_token=...&refresh_token=...&type=signup
    function parseParams() {
      const url = new URL(window.location.href);
      const q = url.searchParams;

      const hash = (window.location.hash || "").replace(/^#/, "");
      const h = new URLSearchParams(hash);

      return {
        code: q.get("code") || null,
        token_hash: q.get("token_hash") || null,
        type: q.get("type") || null,
        access_token: h.get("access_token") || null,
        refresh_token: h.get("refresh_token") || null,
        hash_type: h.get("type") || null,
      };
    }

    async function establishSessionFromLink(p) {
      if (p.code) {
        const { error } = await supabase.auth.exchangeCodeForSession(p.code);
        if (error) throw error;
        return;
      }

      if (p.token_hash) {
        const t = p.type || "signup";
        const { error } = await supabase.auth.verifyOtp({ token_hash: p.token_hash, type: t });
        if (error) throw error;
        return;
      }

      if (p.access_token && p.refresh_token) {
        const { error } = await supabase.auth.setSession({
          access_token: p.access_token,
          refresh_token: p.refresh_token,
        });
        if (error) throw error;
        return;
      }

      throw new Error("Missing verification parameters in the link.");
    }

    (async () => {
      try {
        if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "__SUPABASE_ANON_KEY__") {
          title.textContent = "Setup needed";
          msg.textContent = "This page is missing the Supabase anon key.";
          setError("Add your Supabase anon public key in this file (Project Settings → API).", true);
          return;
        }

        const p = parseParams();
        await establishSessionFromLink(p);
        setSuccess();
      } catch (e) {
        setError(e?.message || "Unknown error.", true);
      }
    })();
  </script>
</body>
</html>
