<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TISSCA — Email Verified</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background:#1b1412; color:#f4eee9; }
    .card { max-width: 520px; margin: 10vh auto; background:#2a1f1b; border-radius: 18px; padding: 28px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 10px 0; opacity: .9; line-height: 1.5; }
    .btn { margin-top: 18px; display:inline-block; padding: 12px 16px; border-radius: 999px; background:#ffb38f; color:#2a1f1b; text-decoration:none; font-weight: 600; }
    .muted { opacity:.75; font-size: 13px; margin-top: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Verifying…</h1>
    <p id="msg">Please wait.</p>
    <a id="openApp" class="btn" href="tissca://auth/callback" style="display:none;">Open the app</a>
    <div id="debug" class="muted"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://ovkpblbnnvnmsulrrnor.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const openApp = document.getElementById("openApp");
    const debug = document.getElementById("debug");

    function showOk(text) {
      title.textContent = "Email verified";
      msg.textContent = text;
      openApp.style.display = "inline-block";
    }
    function showErr(text) {
      title.textContent = "Verification failed";
      msg.textContent = text;
      debug.textContent = window.location.href;
    }

    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const token_hash = url.searchParams.get("token_hash");
    const type = url.searchParams.get("type");

    try {
      // Newer Supabase links often use `code`
      if (code) {
        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;
        showOk("Thanks — your email has been verified. You can now return to the app and sign in.");
        return;
      }

      // Older links use token_hash + type
      if (token_hash && type) {
        const { data, error } = await supabase.auth.verifyOtp({ token_hash, type });
        if (error) throw error;
        showOk("Thanks — your email has been verified. You can now return to the app and sign in.");
        return;
      }

      showErr("Missing verification parameters in the link.");
    } catch (e) {
      showErr(e?.message || "Unknown error.");
    }
  </script>
</body>
</html>
